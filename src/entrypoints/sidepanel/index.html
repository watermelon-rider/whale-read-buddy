<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WhaleRead Buddy</title>
    <!-- 字体：谷歌 Fonts 优先；media=print 使其不阻塞首屏渲染，加载完成后切回 all；
         失败自动换国内镜像（fonts.loli.net）；再退化为系统中文字体。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      media="print"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap"
      onload="this.media='all'"
      onerror="this.onerror=null;this.href='https://fonts.loli.net/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap'"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
