# 构建并打包 Chrome 扩展。
# push 到 main / PR：跑测试 + 构建 + 上传 zip artifact（7 天保留）。
# 打 v* tag：创建 GitHub Release 并挂上可直接安装的 zip。
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # .wxt/tsconfig.json 是生成物（被 gitignore），先 prepare 才能跑测试和类型检查。
      - name: WXT prepare
        run: pnpm exec wxt prepare

      - name: Unit tests
        run: pnpm test

      - name: Type check
        run: pnpm compile

      - name: Build extension
        run: pnpm build

      - name: Package zip
        run: pnpm zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: whale-read-buddy-chrome-mv3
          path: .output/*.zip
          retention-days: 7

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: .output/*.zip
